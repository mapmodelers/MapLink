; MapLink marketplace packaging filter.
; UAT BuildPlugin / FAB packaging only copies standard plugin directories
; (Source, Content, Resources, Config) by default. The paths below are
; ADDITIONAL include patterns so the Blender addon and headless scripts ship
; with the plugin.
;
; NOTE: [FilterPlugin] supports include patterns ONLY — there is no exclusion
; syntax. Compiled Python (blender/__pycache__/, *.pyc) is kept out of the
; package by keeping it out of the tree: __pycache__/ and *.pyc are
; .gitignore'd, and marketplace packaging must run from a clean checkout
; (fresh clone or after the per-iteration cleanup script).

[FilterPlugin]
/blender/...
/Scripts/...
